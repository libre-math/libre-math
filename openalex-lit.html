<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explore philosophy and literature papers from OpenAlex — technical report style.">
  <title>OpenAlex Papers | Libre Lit</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    /* Same CSS as before */
    :root {
      --bg: #f4efe4;
      --bg-alt: #ebe4d6;
      --bg-paper: #f9f5eb;
      --text: #1c1914;
      --text-muted: #5c5548;
      --border: #2a2620;
      --border-light: #c9c0b0;
      --accent: #1a5c5c;
      --accent-soft: rgba(26, 92, 92, 0.08);
      --header-bg: #e6dfd0;
      --button-bg: #1c1914;
      --button-text: #f4efe4;
      --button-hover: #3a342c;
      --result-hover: #e6dfd0;
      --rule: #2a2620;
      --stamp-bg: #e6dfd0;
    }

    [data-theme="dark"] {
      --bg: #0f0e0c;
      --bg-alt: #1a1814;
      --bg-paper: #161410;
      --text: #e8e2d4;
      --text-muted: #a89f8f;
      --border: #3d3830;
      --border-light: #2e2a24;
      --accent: #6cb4b4;
      --accent-soft: rgba(108, 180, 180, 0.12);
      --header-bg: #1a1814;
      --button-bg: #e8e2d4;
      --button-text: #0f0e0c;
      --button-hover: #ffffff;
      --result-hover: #25221c;
      --rule: #3d3830;
      --stamp-bg: #1f1c18;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--bg);
      color: var(--text);
      font-family: "Source Serif 4", Georgia, serif;
      line-height: 1.65;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .skip-link {
      position: absolute;
      left: -9999px;
      top: 0;
      background: var(--accent);
      color: #fff;
      padding: 8px 14px;
      z-index: 10;
    }
    .skip-link:focus { left: 0; }

    .report {
      max-width: 880px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg-paper);
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      box-shadow: 0 0 40px rgba(0,0,0,0.06);
    }

    [data-theme="dark"] .report {
      box-shadow: 0 0 60px rgba(0,0,0,0.45);
    }

    .report-header {
      background: var(--header-bg);
      border-bottom: 3px double var(--border);
      padding: 1.15rem 1.6rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      flex-wrap: wrap;
      position: relative;
    }

    .report-header::after {
      content: "";
      position: absolute;
      left: 1.6rem;
      right: 1.6rem;
      bottom: 6px;
      height: 1px;
      background: var(--border-light);
    }

    .report-agency {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.3rem;
      font-weight: 500;
    }

    .report-title {
      margin: 0;
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.015em;
      line-height: 1.25;
    }

    .report-header-right {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .report-body {
      flex: 1;
      padding: 1.9rem 1.7rem 3.2rem;
    }

    .rule {
      border: none;
      border-top: 1px solid var(--rule);
      margin: 1.6rem 0;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 1.4rem 2.2rem;
      margin-bottom: 0.4rem;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .control-group label {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 500;
    }

    select,
    input[type="text"] {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.88rem;
      padding: 0.55rem 0.75rem;
      background: var(--bg-alt);
      color: var(--text);
      border: 1px solid var(--border);
      min-width: 230px;
      border-radius: 0;
    }

    select:focus,
    input[type="text"]:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .search-row {
      display: flex;
      gap: 0.45rem;
      flex-wrap: wrap;
    }

    #keyword-input {
      min-width: 250px;
      flex: 1;
    }

    .btn {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.78rem;
      font-weight: 500;
      padding: 0.55rem 1.05rem;
      background: var(--button-bg);
      color: var(--button-text);
      border: 1px solid var(--border);
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      text-decoration: none;
      display: inline-block;
      transition: background 0.15s ease, color 0.15s ease, transform 0.1s ease;
      border-radius: 0;
    }

    .btn:hover {
      background: var(--button-hover);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-outline {
      background: transparent;
      color: var(--text);
    }

    .btn-outline:hover {
      background: var(--bg-alt);
      color: var(--text);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: default;
      transform: none;
    }

    .status {
      font-family: "IBM Plex Mono", monospace;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .paper-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 0.9rem;
      margin-bottom: 0.85rem;
      font-size: 0.8rem;
      background: var(--stamp-bg);
      padding: 0.55rem 0.85rem;
      border: 1px solid var(--border-light);
    }

    .mono {
      font-family: "IBM Plex Mono", monospace;
      color: var(--text-muted);
    }

    .paper-title {
      margin: 0 0 0.5rem;
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: -0.01em;
    }

    .paper-authors {
      margin: 0 0 0.35rem;
      font-size: 0.92rem;
      color: var(--text-muted);
    }

    .paper-abstract {
      font-size: 1.06rem;
      line-height: 1.78;
      text-align: justify;
      max-width: none;
      margin: 1.35rem 0 1.8rem;
      hyphens: auto;
    }

    .paper-actions {
      display: flex;
      gap: 0.55rem;
      flex-wrap: wrap;
      margin-top: 0.5rem;
    }

    .results-section {
      margin-top: 2.2rem;
    }

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.8rem;
      margin-bottom: 0.85rem;
    }

    .results-header h3 {
      margin: 0;
      font-size: 1.08rem;
      font-weight: 700;
    }

    .results-nav {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .results-box {
      border: 1px solid var(--border);
      background: var(--bg-alt);
      max-height: 440px;
      overflow-y: auto;
    }

    .result-item {
      padding: 0.9rem 1.15rem;
      border-bottom: 1px solid var(--border-light);
      cursor: pointer;
      transition: background 0.15s ease;
      border-left: 3px solid transparent;
    }

    .result-item:last-child {
      border-bottom: none;
    }

    .result-item:hover {
      background: var(--result-hover);
      border-left-color: var(--accent);
    }

    .result-title {
      font-weight: 600;
      margin-bottom: 0.25rem;
      line-height: 1.35;
    }

    .result-meta {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.76rem;
      color: var(--text-muted);
    }

    .report-footer {
      border-top: 1px solid var(--border);
      padding: 1.05rem 1.6rem;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      text-align: center;
      background: var(--header-bg);
    }

    .paper-layout {
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 1.75rem;
      align-items: start;
    }

    .paper-main {
      min-width: 0;
    }

    .summary-panel {
      background: var(--bg-alt);
      border: 1px solid var(--border);
      padding: 1.1rem 1.15rem 1.25rem;
      position: sticky;
      top: 1.25rem;
    }

    .summary-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.85rem;
      gap: 0.5rem;
    }

    .summary-label {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 500;
    }

    .summary-box {
      font-size: 0.95rem;
      line-height: 1.55;
      color: var(--text);
    }

    .summary-placeholder {
      margin: 0;
      color: var(--text-muted);
      font-style: italic;
      font-size: 0.9rem;
    }

    .summary-result {
      margin: 0;
      font-weight: 500;
    }

    .summary-loading {
      color: var(--text-muted);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.82rem;
    }

    @media (max-width: 720px) {
      .paper-layout {
        grid-template-columns: 1fr;
      }
      .summary-panel {
        position: static;
      }
    }

    @media (max-width: 640px) {
      .report {
        border: none;
        box-shadow: none;
      }
      .report-body {
        padding: 1.35rem 1.1rem 2.6rem;
      }
      .report-header {
        padding: 1rem 1.1rem 1.15rem;
      }
      .report-header::after {
        left: 1.1rem;
        right: 1.1rem;
      }
      .paper-title {
        font-size: 1.28rem;
      }
    }
  </style>
</head>
<body>

  <a class="skip-link" href="#main-content">Skip to content</a>

  <div class="report">
    <header class="report-header">
      <div class="report-header-left">
        <div class="report-agency">LIBRE LIT · TECHNICAL MEMORANDUM</div>
        <h1 class="report-title">OpenAlex Papers — Literature &amp; Philosophy</h1>
      </div>
      <div class="report-header-right">
        <button id="theme-toggle" class="btn" aria-label="Toggle theme">Dark</button>
        <a href="index.html" class="btn btn-outline">← Home</a>
      </div>
    </header>

    <main id="main-content" class="report-body">
      <section class="controls">
        <div class="control-group">
          <label for="topic-select">Topic</label>
          <select id="topic-select">
            <optgroup label="Religious Studies">
              <option value="Biblical studies" selected>Biblical studies</option>
              <option value="Theology">Theology</option>
              <option value="Philosophy of religion">Philosophy of religion</option>
              <option value="Religious studies">Religious studies</option>
            </optgroup>
            <optgroup label="Philosophy">
              <option value="Aesthetics">Aesthetics</option>
              <option value="Epistemology">Epistemology</option>
              <option value="Ethics">Ethics</option>
              <option value="Existentialism">Existentialism</option>
              <option value="Metaphysics">Metaphysics</option>
              <option value="Ontology">Ontology</option>
              <option value="Phenomenology">Phenomenology</option>
              <option value="Philosophy of mind">Philosophy of mind</option>
              <option value="Philosophy of science">Philosophy of science</option>
              <option value="Political philosophy">Political philosophy</option>
            </optgroup>
            <optgroup label="Literature">
              <option value="Literary criticism">Literary criticism</option>
              <option value="Literary theory">Literary theory</option>
              <option value="Narrative">Narrative</option>
              <option value="Poetics">Poetics</option>
              <option value="Postmodernism">Postmodernism</option>
              <option value="Critical theory">Critical theory</option>
            </optgroup>
            <optgroup label="Other Humanities">
              <option value="Classics">Classics</option>
              <option value="History">History</option>
              <option value="Linguistics">Linguistics</option>
              <option value="Cultural studies">Cultural studies</option>
              <option value="Gender studies">Gender studies</option>
            </optgroup>
          </select>
        </div>

        <div class="control-group search-group">
          <label for="keyword-input">Keyword search (title only)</label>
          <div class="search-row">
            <input type="text" id="keyword-input" placeholder="e.g. Heidegger, narrative, consciousness…" autocomplete="off">
            <button id="search-btn" class="btn">Search</button>
            <button id="search-all-btn" class="btn btn-outline" title="Search across all topics">Search all</button>
          </div>
        </div>
      </section>

      <hr class="rule">

      <section id="paper-view" class="paper-view">
        <div id="paper-status" class="status">Loading newest paper…</div>

        <div id="paper-content" class="paper-layout" hidden>
          <div class="paper-main">
            <div class="paper-meta">
              <span id="paper-id" class="mono"></span>
              <span id="paper-date" class="mono"></span>
              <span id="paper-cats" class="mono"></span>
              <span id="paper-type" class="mono"></span>
            </div>
            <h2 id="paper-title" class="paper-title"></h2>
            <p id="paper-authors" class="paper-authors mono"></p>
            <hr class="rule">
            <div id="paper-abstract" class="paper-abstract"></div>
            <div class="paper-actions">
              <a id="paper-abs-link" class="btn" target="_blank" rel="noopener">OpenAlex page</a>
              <a id="paper-pdf-link" class="btn" target="_blank" rel="noopener">PDF</a>
              <button id="random-paper-btn" class="btn">Random paper</button>
            </div>
          </div>

          <aside class="summary-panel">
            <div class="summary-header">
              <span class="summary-label">Quick take</span>
              <button id="summarize-btn" class="btn btn-outline">Sum up</button>
            </div>
            <div id="summary-box" class="summary-box">
              <p class="summary-placeholder">Click “Sum up” for a short, plain-English version of the abstract.</p>
            </div>
          </aside>
        </div>
      </section>

      <section id="results-section" class="results-section" hidden>
        <div class="results-header">
          <h3>Search results</h3>
          <div class="results-nav">
            <button id="prev-btn" class="btn btn-outline" disabled>← Previous</button>
            <span id="results-info" class="mono"></span>
            <button id="next-btn" class="btn btn-outline" disabled>Next 10 →</button>
          </div>
        </div>
        <div id="results-box" class="results-box"></div>
      </section>

    </main>

    <footer class="report-footer">
      Data from OpenAlex API · Libre Lit
    </footer>
  </div>

  <script>
    // =========================================================
    // OpenAlex Technical Report — Topic ID filtering
    // =========================================================

    // Topic configuration with OpenAlex IDs
    const TOPICS = {
        'Biblical studies': { id: 'T10362', name: 'Biblical studies' },
        'Theology': { id: 'T10520', name: 'Theology' },
        'Philosophy of religion': { id: 'T10728', name: 'Philosophy of religion' },
        'Religious studies': { id: 'T10361', name: 'Religious studies' },
        'Aesthetics': { id: 'T10409', name: 'Aesthetics' },
        'Epistemology': { id: 'T10720', name: 'Epistemology' },
        'Ethics': { id: 'T10415', name: 'Ethics' },
        'Existentialism': { id: 'T10426', name: 'Existentialism' },
        'Metaphysics': { id: 'T10750', name: 'Metaphysics' },
        'Ontology': { id: 'T10416', name: 'Ontology' },
        'Phenomenology': { id: 'T10397', name: 'Phenomenology' },
        'Philosophy of mind': { id: 'T10427', name: 'Philosophy of mind' },
        'Philosophy of science': { id: 'T10430', name: 'Philosophy of science' },
        'Political philosophy': { id: 'T10840', name: 'Political philosophy' },
        'Literary criticism': { id: 'T10359', name: 'Literary criticism' },
        'Literary theory': { id: 'T10360', name: 'Literary theory' },
        'Narrative': { id: 'T10420', name: 'Narrative' },
        'Poetics': { id: 'T10421', name: 'Poetics' },
        'Postmodernism': { id: 'T10422', name: 'Postmodernism' },
        'Critical theory': { id: 'T10423', name: 'Critical theory' },
        'Classics': { id: 'T10363', name: 'Classics' },
        'History': { id: 'T10056', name: 'History' },
        'Linguistics': { id: 'T10463', name: 'Linguistics' },
        'Cultural studies': { id: 'T10424', name: 'Cultural studies' },
        'Gender studies': { id: 'T10425', name: 'Gender studies' },
    };

    const topicSelect = document.getElementById("topic-select");
    const keywordInput = document.getElementById("keyword-input");
    const searchBtn = document.getElementById("search-btn");
    const searchAllBtn = document.getElementById("search-all-btn");
    const paperStatus = document.getElementById("paper-status");
    const paperContent = document.getElementById("paper-content");
    const resultsSection = document.getElementById("results-section");
    const resultsBox = document.getElementById("results-box");
    const resultsInfo = document.getElementById("results-info");
    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");
    const themeToggle = document.getElementById("theme-toggle");
    const randomPaperBtn = document.getElementById("random-paper-btn");
    const summarizeBtn = document.getElementById("summarize-btn");
    const summaryBox = document.getElementById("summary-box");

    let currentStart = 0;
    let lastIsAll = false;
    const PAGE_SIZE = 10;
    let currentPapers = [];
    let currentTopicName = "Biblical studies";
    let currentTopicId = "T10362";

    // ---------- Theme ----------
    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      if (themeToggle) {
        themeToggle.textContent = theme === "dark" ? "Light" : "Dark";
      }
      try {
        localStorage.setItem("openalex-theme", theme);
      } catch (e) {}
    }

    (function initTheme() {
      let saved = "light";
      try {
        saved = localStorage.getItem("openalex-theme") || "light";
      } catch (e) {}
      applyTheme(saved);
    })();

    if (themeToggle) {
      themeToggle.addEventListener("click", function () {
        const current = document.documentElement.getAttribute("data-theme") || "light";
        applyTheme(current === "dark" ? "light" : "dark");
      });
    }

    // ---------- Helpers ----------
    function showStatus(msg) {
      if (paperContent) paperContent.hidden = true;
      if (paperStatus) {
        paperStatus.hidden = false;
        paperStatus.textContent = msg;
      }
    }

    function showPaper(paper) {
      if (paperStatus) paperStatus.hidden = true;
      if (paperContent) paperContent.hidden = false;

      document.getElementById("paper-id").textContent = paper.id || "";
      document.getElementById("paper-date").textContent = paper.published || "";
      document.getElementById("paper-cats").textContent = paper.topics || "";
      document.getElementById("paper-type").textContent = paper.type || "";
      document.getElementById("paper-title").textContent = paper.title || "";
      document.getElementById("paper-authors").textContent = paper.authors || "";
      document.getElementById("paper-abstract").textContent = paper.abstract || "";

      const absLink = document.getElementById("paper-abs-link");
      const pdfLink = document.getElementById("paper-pdf-link");
      if (absLink) absLink.href = paper.openalex_url || "#";
      if (pdfLink) {
        pdfLink.href = paper.pdf_url || paper.openalex_url || "#";
        if (!paper.pdf_url) {
          pdfLink.style.opacity = "0.5";
          pdfLink.textContent = "No PDF";
        } else {
          pdfLink.style.opacity = "1";
          pdfLink.textContent = "PDF";
        }
      }

      if (summaryBox) {
        summaryBox.innerHTML = '<p class="summary-placeholder">Click “Sum up” for a short, plain-English version of the abstract.</p>';
      }
    }

    function parseOpenAlex(data) {
      if (!data || !data.results) return [];
      return data.results.map(function (work) {
        const id = work.id ? work.id.split("/").pop() : "";
        const title = work.title || "Untitled";
        const abstract = work.abstract || "No abstract available.";
        const published = work.publication_date ? work.publication_date.slice(0, 10) : "";
        const authors = (work.authorships || [])
          .map(function (a) {
            return a.author && a.author.display_name ? a.author.display_name : "";
          })
          .filter(Boolean)
          .join(", ") || "Unknown author";
        const topics = (work.topics || [])
          .map(function (t) { return t.display_name; })
          .filter(Boolean)
          .slice(0, 3)
          .join(", ");
        const type = work.type || "";
        const openalex_url = work.id || "#";
        const pdf_url = (work.open_access && work.open_access.oa_url) || null;
        return {
          id: id,
          title: title,
          abstract: abstract,
          published: published,
          authors: authors,
          topics: topics,
          type: type,
          openalex_url: openalex_url,
          pdf_url: pdf_url
        };
      });
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // ---------- Direct fetch (OpenAlex supports CORS!) ----------
    async function fetchOpenAlex(queryParams) {
      const baseUrl = "https://api.openalex.org/works";
      const url = baseUrl + "?" + queryParams;
      
      console.log("Fetching URL:", url);
      
      try {
        const res = await fetch(url, {
          headers: {
            'Accept': 'application/json',
          }
        });
        
        if (!res.ok) {
          const errorText = await res.text();
          throw new Error("HTTP " + res.status + ": " + errorText.substring(0, 200));
        }
        
        const data = await res.json();
        console.log("Success! Got", data.meta.count, "results");
        return data;
      } catch (err) {
        console.error("Fetch error:", err);
        throw err;
      }
    }

    // ---------- Load paper using Topic ID ----------
    async function loadPaper(topicName, random) {
      showStatus(random ? "Loading random paper…" : "Loading newest paper…");
      if (resultsSection) resultsSection.hidden = true;
      currentTopicName = topicName;
      
      const topic = TOPICS[topicName];
      if (!topic) {
        showStatus("Topic not found: " + topicName);
        return;
      }
      currentTopicId = topic.id;

      try {
        let query = "filter=type:book-chapter,type:book,type:edited-book";
        
        // Use topic ID for precise filtering
        query += ",topics.id:" + topic.id;
        query += "&sort=publication_date:desc";
        query += "&per-page=1";
        
        if (random) {
          // Get random by using a random page
          const randomPage = Math.floor(Math.random() * 50) + 1;
          query += "&page=" + randomPage;
        } else {
          query += "&page=1";
        }

        console.log("Final query:", query);
        const data = await fetchOpenAlex(query);
        const papers = parseOpenAlex(data);

        if (!papers || papers.length === 0) {
          showStatus("No papers found for: " + topicName + ". Try a different topic.");
          return;
        }
        showPaper(papers[0]);
      } catch (err) {
        console.error("Load error:", err);
        showStatus("Error loading papers: " + err.message);
      }
    }

    // ---------- Search within topic ----------
    async function runSearch(start) {
      start = start || 0;
      const keyword = (keywordInput && keywordInput.value) ? keywordInput.value.trim() : "";
      if (!keyword) {
        alert("Please type a keyword first.");
        return;
      }

      currentStart = start;
      if (resultsSection) resultsSection.hidden = false;
      resultsBox.innerHTML = '<div class="status" style="padding:1rem">Searching…</div>';
      if (resultsInfo) resultsInfo.textContent = "";
      if (prevBtn) prevBtn.disabled = true;
      if (nextBtn) nextBtn.disabled = true;

      try {
        let query = "filter=type:book-chapter,type:book,type:edited-book";
        
        if (lastIsAll) {
          // Search all: just keyword search across all topics
          query += "&search=" + encodeURIComponent('"' + keyword + '"');
        } else {
          // Search within current topic: use topic ID + keyword
          query += ",topics.id:" + currentTopicId;
          query += "&search=" + encodeURIComponent('"' + keyword + '"');
        }
        
        query += "&sort=relevance_score:desc";
        query += "&page=" + (Math.floor(start / PAGE_SIZE) + 1);
        query += "&per-page=" + PAGE_SIZE;

        console.log("Search query:", query);
        const data = await fetchOpenAlex(query);
        const papers = parseOpenAlex(data);
        currentPapers = papers;

        resultsBox.innerHTML = "";
        if (!papers || papers.length === 0) {
          resultsBox.innerHTML = '<div class="status" style="padding:1rem">No results found for: "' + keyword + '"</div>';
          return;
        }

        papers.forEach(function (p) {
          const div = document.createElement("div");
          div.className = "result-item";
          div.innerHTML =
            '<div class="result-title">' + escapeHtml(p.title) + '</div>' +
            '<div class="result-meta">' + escapeHtml(p.authors) + " · " + p.published + " · " + escapeHtml(p.topics) + "</div>";
          div.addEventListener("click", function () {
            showPaper(p);
            window.scrollTo({ top: 0, behavior: "smooth" });
          });
          resultsBox.appendChild(div);
        });

        if (resultsInfo) resultsInfo.textContent = (start + 1) + "–" + (start + papers.length);
        if (prevBtn) prevBtn.disabled = start === 0;
        if (nextBtn) nextBtn.disabled = papers.length < PAGE_SIZE;
      } catch (err) {
        console.error("Search error:", err);
        resultsBox.innerHTML = '<div class="status" style="padding:1rem">Search failed: ' + err.message + '</div>';
      }
    }

    // ---------- Summary ----------
    async function summarizeAbstract() {
      const abstractEl = document.getElementById("paper-abstract");
      const abstract = abstractEl ? abstractEl.textContent.trim() : "";

      if (!abstract || abstract === "No abstract available.") {
        if (summaryBox) {
          summaryBox.innerHTML = '<p class="summary-placeholder">No abstract to summarize.</p>';
        }
        return;
      }

      if (summaryBox) {
        summaryBox.innerHTML = '<p class="summary-loading">Summarizing…</p>';
      }
      if (summarizeBtn) summarizeBtn.disabled = true;

      const prompt = "Explain this academic abstract in very simple words that a 15-year-old could easily understand. Use short sentences. Avoid all jargon and technical terms. Write about 120 to 150 words:\n\n" + abstract;

      const model = "sshleifer/distilbart-cnn-12-6";
      const url = "https://api-inference.huggingface.co/models/" + model;

      try {
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            inputs: prompt,
            parameters: {
              max_length: 220,
              min_length: 100,
              do_sample: false
            }
          })
        });

        if (!res.ok) throw new Error("HF status " + res.status);

        const data = await res.json();
        let summary = "";

        if (Array.isArray(data) && data[0] && data[0].summary_text) {
          summary = data[0].summary_text;
        } else if (data.summary_text) {
          summary = data.summary_text;
        } else {
          throw new Error("Unexpected response");
        }

        const words = summary.split(/\s+/);
        if (words.length > 160) {
          summary = words.slice(0, 155).join(" ") + "…";
        }

        if (summaryBox) {
          summaryBox.innerHTML = '<p class="summary-result">' + escapeHtml(summary) + '</p>';
        }
      } catch (err) {
        console.error("Summary error:", err);

        const sentences = abstract.match(/[^.!?]+[.!?]+/g) || [abstract];
        let fallback = sentences.slice(0, 4).join(" ");
        const words = fallback.trim().split(/\s+/);
        fallback = words.slice(0, 150).join(" ") + (words.length > 150 ? "…" : "");

        if (summaryBox) {
          summaryBox.innerHTML = '<p class="summary-result">' + escapeHtml(fallback) + '</p>';
        }
      } finally {
        if (summarizeBtn) summarizeBtn.disabled = false;
      }
    }
