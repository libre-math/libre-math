<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CORE Papers | Libre Lit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    /* Minimal styles - keeping it clean */
    :root {
      --bg: #f4efe4; --bg-alt: #ebe4d6; --bg-paper: #f9f5eb;
      --text: #1c1914; --text-muted: #5c5548; --border: #2a2620;
      --border-light: #c9c0b0; --accent: #1a5c5c; --header-bg: #e6dfd0;
      --button-bg: #1c1914; --button-text: #f4efe4; --button-hover: #3a342c;
      --result-hover: #e6dfd0; --rule: #2a2620; --stamp-bg: #e6dfd0;
    }
    [data-theme="dark"] {
      --bg: #0f0e0c; --bg-alt: #1a1814; --bg-paper: #161410;
      --text: #e8e2d4; --text-muted: #a89f8f; --border: #3d3830;
      --border-light: #2e2a24; --accent: #6cb4b4; --header-bg: #1a1814;
      --button-bg: #e8e2d4; --button-text: #0f0e0c; --button-hover: #ffffff;
      --result-hover: #25221c; --rule: #3d3830; --stamp-bg: #1f1c18;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background-color: var(--bg); color: var(--text);
      font-family: "Source Serif 4", Georgia, serif; line-height: 1.65;
      transition: background-color 0.25s ease, color 0.25s ease;
    }
    .report {
      max-width: 880px; margin: 0 auto; min-height: 100vh;
      background: var(--bg-paper); border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }
    .report-header {
      background: var(--header-bg); border-bottom: 3px double var(--border);
      padding: 1.15rem 1.6rem 1.25rem;
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 1rem; flex-wrap: wrap; position: relative;
    }
    .report-agency {
      font-family: "IBM Plex Mono", monospace; font-size: 0.68rem;
      letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent);
      margin-bottom: 0.3rem; font-weight: 500;
    }
    .report-title { margin: 0; font-size: 1.4rem; font-weight: 700; letter-spacing: -0.015em; line-height: 1.25; }
    .report-body { flex: 1; padding: 1.9rem 1.7rem 3.2rem; }
    .rule { border: none; border-top: 1px solid var(--rule); margin: 1.6rem 0; }
    .controls { display: flex; flex-wrap: wrap; gap: 1.4rem 2.2rem; margin-bottom: 0.4rem; }
    .control-group { display: flex; flex-direction: column; gap: 0.4rem; }
    .control-group label {
      font-family: "IBM Plex Mono", monospace; font-size: 0.7rem;
      letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted);
      font-weight: 500;
    }
    select, input[type="text"] {
      font-family: "IBM Plex Mono", monospace; font-size: 0.88rem;
      padding: 0.55rem 0.75rem; background: var(--bg-alt); color: var(--text);
      border: 1px solid var(--border); min-width: 200px; border-radius: 0;
    }
    .search-row { display: flex; gap: 0.45rem; flex-wrap: wrap; }
    #keyword-input { min-width: 200px; flex: 1; }
    .btn {
      font-family: "IBM Plex Mono", monospace; font-size: 0.78rem;
      font-weight: 500; padding: 0.55rem 1.05rem;
      background: var(--button-bg); color: var(--button-text);
      border: 1px solid var(--border); cursor: pointer;
      text-transform: uppercase; letter-spacing: 0.07em;
      transition: background 0.15s ease; border-radius: 0;
    }
    .btn:hover { background: var(--button-hover); }
    .btn-outline { background: transparent; color: var(--text); }
    .btn-outline:hover { background: var(--bg-alt); color: var(--text); }
    .btn:disabled { opacity: 0.4; cursor: default; }
    .status { font-family: "IBM Plex Mono", monospace; color: var(--text-muted); font-size: 0.9rem; }
    .paper-meta {
      display: flex; flex-wrap: wrap; gap: 0.5rem 0.9rem; margin-bottom: 0.85rem;
      font-size: 0.8rem; background: var(--stamp-bg); padding: 0.55rem 0.85rem;
      border: 1px solid var(--border-light);
    }
    .mono { font-family: "IBM Plex Mono", monospace; color: var(--text-muted); }
    .paper-title { margin: 0 0 0.5rem; font-size: 1.5rem; font-weight: 700; line-height: 1.3; letter-spacing: -0.01em; }
    .paper-authors { margin: 0 0 0.35rem; font-size: 0.92rem; color: var(--text-muted); }
    .paper-abstract { font-size: 1.06rem; line-height: 1.78; text-align: justify; margin: 1.35rem 0 1.8rem; }
    .paper-actions { display: flex; gap: 0.55rem; flex-wrap: wrap; margin-top: 0.5rem; }
    .results-section { margin-top: 2.2rem; }
    .results-header {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 0.8rem; margin-bottom: 0.85rem;
    }
    .results-header h3 { margin: 0; font-size: 1.08rem; font-weight: 700; }
    .results-nav { display: flex; align-items: center; gap: 0.65rem; }
    .results-box {
      border: 1px solid var(--border); background: var(--bg-alt);
      max-height: 440px; overflow-y: auto;
    }
    .result-item {
      padding: 0.9rem 1.15rem; border-bottom: 1px solid var(--border-light);
      cursor: pointer; transition: background 0.15s ease;
      border-left: 3px solid transparent;
    }
    .result-item:hover { background: var(--result-hover); border-left-color: var(--accent); }
    .result-title { font-weight: 600; margin-bottom: 0.25rem; line-height: 1.35; }
    .result-meta { font-family: "IBM Plex Mono", monospace; font-size: 0.76rem; color: var(--text-muted); }
    .report-footer {
      border-top: 1px solid var(--border); padding: 1.05rem 1.6rem;
      font-family: "IBM Plex Mono", monospace; font-size: 0.72rem;
      letter-spacing: 0.04em; color: var(--text-muted); text-align: center;
      background: var(--header-bg);
    }
    .paper-layout { display: grid; grid-template-columns: 1fr 280px; gap: 1.75rem; align-items: start; }
    .paper-main { min-width: 0; }
    .summary-panel {
      background: var(--bg-alt); border: 1px solid var(--border);
      padding: 1.1rem 1.15rem 1.25rem; position: sticky; top: 1.25rem;
    }
    .summary-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.85rem; gap: 0.5rem; }
    .summary-label {
      font-family: "IBM Plex Mono", monospace; font-size: 0.7rem;
      letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent);
      font-weight: 500;
    }
    .summary-box { font-size: 0.95rem; line-height: 1.55; color: var(--text); }
    .summary-placeholder { margin: 0; color: var(--text-muted); font-style: italic; font-size: 0.9rem; }
    .summary-result { margin: 0; font-weight: 500; }
    .summary-loading { color: var(--text-muted); font-family: "IBM Plex Mono", monospace; font-size: 0.82rem; }
    .pdf-badge {
      display: inline-block; font-size: 0.6rem; padding: 0.1rem 0.5rem;
      background: var(--accent); color: white;
      font-family: "IBM Plex Mono", monospace; letter-spacing: 0.05em;
      margin-left: 0.5rem; border-radius: 0;
    }
    .pdf-available { display: inline-block; font-size: 0.7rem; padding: 0.15rem 0.6rem; background: #1a5c5c; color: white; font-family: "IBM Plex Mono", monospace; letter-spacing: 0.05em; }
    @media (max-width: 720px) { .paper-layout { grid-template-columns: 1fr; } .summary-panel { position: static; } }
    @media (max-width: 640px) {
      .report { border: none; }
      .report-body { padding: 1.35rem 1.1rem 2.6rem; }
      .report-header { padding: 1rem 1.1rem 1.15rem; }
      .paper-title { font-size: 1.28rem; }
    }
  </style>
</head>
<body>
  <div class="report">
    <header class="report-header">
      <div class="report-header-left">
        <div class="report-agency">LIBRE LIT · TECHNICAL MEMORANDUM</div>
        <h1 class="report-title">CORE Papers — Literature &amp; Philosophy</h1>
      </div>
      <div class="report-header-right">
        <button id="theme-toggle" class="btn" aria-label="Toggle theme">Dark</button>
        <a href="index.html" class="btn btn-outline">← Home</a>
      </div>
    </header>

    <main class="report-body">
      <section class="controls">
        <div class="control-group">
          <label for="topic-select">Topic</label>
          <select id="topic-select">
            <option value="biblical studies">Biblical studies</option>
            <option value="theology">Theology</option>
            <option value="philosophy of religion">Philosophy of religion</option>
            <option value="religious studies">Religious studies</option>
            <option value="aesthetics">Aesthetics</option>
            <option value="epistemology">Epistemology</option>
            <option value="ethics">Ethics</option>
            <option value="existentialism">Existentialism</option>
            <option value="metaphysics">Metaphysics</option>
            <option value="ontology">Ontology</option>
            <option value="phenomenology">Phenomenology</option>
            <option value="philosophy of mind">Philosophy of mind</option>
            <option value="political philosophy">Political philosophy</option>
            <option value="literary criticism">Literary criticism</option>
            <option value="literary theory">Literary theory</option>
            <option value="narrative">Narrative</option>
            <option value="poetics">Poetics</option>
            <option value="postmodernism">Postmodernism</option>
            <option value="critical theory">Critical theory</option>
            <option value="classics">Classics</option>
            <option value="history">History</option>
            <option value="linguistics">Linguistics</option>
            <option value="cultural studies">Cultural studies</option>
            <option value="gender studies">Gender studies</option>
          </select>
        </div>

        <div class="control-group search-group">
          <label for="keyword-input">Keyword search (title only)</label>
          <div class="search-row">
            <input type="text" id="keyword-input" placeholder="e.g. Heidegger, narrative…" autocomplete="off">
            <button id="search-btn" class="btn">Search</button>
            <button id="search-all-btn" class="btn btn-outline">Search all</button>
          </div>
        </div>
      </section>

      <hr class="rule">

      <section id="paper-view">
        <div id="paper-status" class="status">Loading newest paper with PDF…</div>
        <div id="paper-content" class="paper-layout" hidden>
          <div class="paper-main">
            <div class="paper-meta">
              <span id="paper-id" class="mono"></span>
              <span id="paper-date" class="mono"></span>
              <span id="paper-cats" class="mono"></span>
              <span id="paper-type" class="mono"></span>
              <span id="paper-oa" class="mono"></span>
            </div>
            <h2 id="paper-title" class="paper-title"></h2>
            <p id="paper-authors" class="paper-authors mono"></p>
            <hr class="rule">
            <div id="paper-abstract" class="paper-abstract"></div>
            <div class="paper-actions">
              <a id="paper-abs-link" class="btn" target="_blank">View on CORE</a>
              <a id="paper-pdf-link" class="btn" target="_blank">Download PDF</a>
              <button id="random-paper-btn" class="btn">Random paper</button>
            </div>
          </div>
          <aside class="summary-panel">
            <div class="summary-header">
              <span class="summary-label">Quick take</span>
              <button id="summarize-btn" class="btn btn-outline">Sum up</button>
            </div>
            <div id="summary-box" class="summary-box">
              <p class="summary-placeholder">Click “Sum up” for a short, plain-English version.</p>
            </div>
          </aside>
        </div>
      </section>

      <section id="results-section" class="results-section" hidden>
        <div class="results-header">
          <h3>Search results</h3>
          <div class="results-nav">
            <button id="prev-btn" class="btn btn-outline" disabled>← Previous</button>
            <span id="results-info" class="mono"></span>
            <button id="next-btn" class="btn btn-outline" disabled>Next 10 →</button>
          </div>
        </div>
        <div id="results-box" class="results-box"></div>
      </section>
    </main>
    <footer class="report-footer">Data from CORE API · Only papers with downloadable PDFs shown · Libre Lit</footer>
  </div>

  <script>
    // =========================================================
    // SIMPLIFIED CORE — Just works
    // =========================================================

    const topicSelect = document.getElementById('topic-select');
    const keywordInput = document.getElementById('keyword-input');
    const searchBtn = document.getElementById('search-btn');
    const searchAllBtn = document.getElementById('search-all-btn');
    const paperStatus = document.getElementById('paper-status');
    const paperContent = document.getElementById('paper-content');
    const resultsSection = document.getElementById('results-section');
    const resultsBox = document.getElementById('results-box');
    const resultsInfo = document.getElementById('results-info');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const themeToggle = document.getElementById('theme-toggle');
    const randomPaperBtn = document.getElementById('random-paper-btn');
    const summarizeBtn = document.getElementById('summarize-btn');
    const summaryBox = document.getElementById('summary-box');

    let currentStart = 0;
    let lastIsAll = false;
    const PAGE_SIZE = 10;
    let currentPapers = [];
    let currentTopic = 'biblical studies';

    // ---------- Theme ----------
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      if (themeToggle) themeToggle.textContent = theme === 'dark' ? 'Light' : 'Dark';
      try { localStorage.setItem('core-theme', theme); } catch(e) {}
    }
    (function() {
      let saved = 'light';
      try { saved = localStorage.getItem('core-theme') || 'light'; } catch(e) {}
      applyTheme(saved);
    })();
    if (themeToggle) {
      themeToggle.addEventListener('click', function() {
        const current = document.documentElement.getAttribute('data-theme') || 'light';
        applyTheme(current === 'dark' ? 'light' : 'dark');
      });
    }

    // ---------- Helpers ----------
    function showStatus(msg) {
      if (paperContent) paperContent.hidden = true;
      if (paperStatus) { paperStatus.hidden = false; paperStatus.textContent = msg; }
    }

    function showPaper(paper) {
      if (paperStatus) paperStatus.hidden = true;
      if (paperContent) paperContent.hidden = false;
      document.getElementById('paper-id').textContent = paper.id || '';
      document.getElementById('paper-date').textContent = paper.published || '';
      document.getElementById('paper-cats').textContent = paper.topics || '';
      document.getElementById('paper-type').textContent = paper.type || '';
      const oaEl = document.getElementById('paper-oa');
      oaEl.innerHTML = paper.has_pdf ? '<span class="pdf-available">✓ PDF Available</span>' : '';
      document.getElementById('paper-title').textContent = paper.title || '';
      document.getElementById('paper-authors').textContent = paper.authors || '';
      document.getElementById('paper-abstract').textContent = paper.abstract || '';
      const absLink = document.getElementById('paper-abs-link');
      const pdfLink = document.getElementById('paper-pdf-link');
      if (absLink) absLink.href = paper.core_url || '#';
      if (pdfLink) {
        if (paper.pdf_url) {
          pdfLink.href = paper.pdf_url;
          pdfLink.textContent = 'Download PDF';
          pdfLink.style.display = 'inline-block';
        } else {
          pdfLink.style.display = 'none';
        }
      }
      if (summaryBox) {
        summaryBox.innerHTML = '<p class="summary-placeholder">Click "Sum up" for a plain-English version.</p>';
      }
    }

    function parseCORE(data) {
      if (!data || !data.results) return [];
      return data.results.map(function(work) {
        const id = work.id || '';
        const title = work.title || 'Untitled';
        const abstract = work.abstract || 'No abstract available.';
        const published = work.year ? String(work.year) : '';
        const authors = (work.authors || []).map(function(a) { return a.name; }).filter(Boolean).join(', ') || 'Unknown author';
        const topics = (work.subjects || []).filter(Boolean).slice(0, 3).join(', ');
        const type = work.type || '';
        const core_url = work.downloadUrl || '#';
        const pdf_url = work.downloadUrl || null;
        const has_pdf = pdf_url !== null && pdf_url !== '';
        return { id, title, abstract, published, authors, topics, type, core_url, pdf_url, has_pdf };
      });
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // ---------- FETCH — simplified with corsproxy.io ----------
    async function fetchCORE(searchQuery, limit, offset, sort, order) {
      // Build the CORE API URL
      let url = 'https://api.core.ac.uk/v3/search/works?';
      url += 'q=' + encodeURIComponent(searchQuery);
      url += '&limit=' + limit;
      url += '&offset=' + offset;
      if (sort) url += '&sort=' + sort;
      if (order) url += '&order=' + order;

      // Use corsproxy.io — the free tier works for localhost and GitHub Pages
      const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(url);
      
      console.log('Fetching:', proxyUrl);
      
      const res = await fetch(proxyUrl);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json();
    }

    // ---------- Load paper ----------
    async function loadPaper(topic, random) {
      showStatus(random ? 'Loading random paper with PDF…' : 'Loading newest paper with PDF…');
      if (resultsSection) resultsSection.hidden = true;
      currentTopic = topic;

      try {
        let searchQuery = topic;
        if (random) searchQuery = 'humanities OR philosophy OR literature';
        
        // Fetch 30 results so we can filter to those with PDFs
        const data = await fetchCORE(searchQuery, 30, 0, 'publishedDate', 'desc');
        let papers = parseCORE(data);
        papers = papers.filter(function(p) { return p.has_pdf; });

        if (!papers || papers.length === 0) {
          showStatus('No papers with PDF found for: ' + topic + '. Try a different topic.');
          return;
        }
        
        // If random, pick a random one from the filtered list
        if (random) {
          const randomIndex = Math.floor(Math.random() * papers.length);
          showPaper(papers[randomIndex]);
        } else {
          showPaper(papers[0]);
        }
      } catch (err) {
        console.error('Load error:', err);
        showStatus('Error: ' + err.message + '. Try again or choose a different topic.');
      }
    }

    // ---------- Search ----------
    async function runSearch(start) {
      const keyword = keywordInput.value.trim();
      if (!keyword) { alert('Please type a keyword first.'); return; }

      currentStart = start;
      resultsSection.hidden = false;
      resultsBox.innerHTML = '<div class="status" style="padding:1rem">Searching…</div>';
      resultsInfo.textContent = '';
      prevBtn.disabled = true;
      nextBtn.disabled = true;

      try {
        let searchQuery;
        if (lastIsAll) {
          searchQuery = 'title:"' + keyword + '"';
        } else {
          searchQuery = 'title:"' + keyword + '" AND ' + currentTopic;
        }

        const data = await fetchCORE(searchQuery, 30, start, 'relevance', 'desc');
        let papers = parseCORE(data);
        papers = papers.filter(function(p) { return p.has_pdf; });
        currentPapers = papers;

        resultsBox.innerHTML = '';
        if (!papers || papers.length === 0) {
          resultsBox.innerHTML = '<div class="status" style="padding:1rem">No papers with PDF found for: "' + keyword + '"</div>';
          return;
        }

        const displayPapers = papers.slice(0, PAGE_SIZE);
        displayPapers.forEach(function(p) {
          const div = document.createElement('div');
          div.className = 'result-item';
          div.innerHTML =
            '<div class="result-title">' + escapeHtml(p.title) + ' <span class="pdf-badge">PDF</span></div>' +
            '<div class="result-meta">' + escapeHtml(p.authors) + ' · ' + p.published + ' · ' + escapeHtml(p.topics) + '</div>';
          div.addEventListener('click', function() { showPaper(p); window.scrollTo({ top: 0, behavior: 'smooth' }); });
          resultsBox.appendChild(div);
        });

        resultsInfo.textContent = (start + 1) + '–' + (start + displayPapers.length);
        prevBtn.disabled = start === 0;
        nextBtn.disabled = papers.length <= PAGE_SIZE;
      } catch (err) {
        console.error('Search error:', err);
        resultsBox.innerHTML = '<div class="status" style="padding:1rem">Search failed: ' + err.message + '</div>';
      }
    }

    // ---------- Summary ----------
    async function summarizeAbstract() {
      const abstract = document.getElementById('paper-abstract').textContent.trim();
      if (!abstract || abstract === 'No abstract available.') {
        summaryBox.innerHTML = '<p class="summary-placeholder">No abstract to summarize.</p>';
        return;
      }
      summaryBox.innerHTML = '<p class="summary-loading">Summarizing…</p>';
      summarizeBtn.disabled = true;

      try {
        const res = await fetch('https://api-inference.huggingface.co/models/sshleifer/distilbart-cnn-12-6', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            inputs: 'Explain this in simple words (120-150 words):\n\n' + abstract,
            parameters: { max_length: 220, min_length: 100, do_sample: false }
          })
        });
        if (!res.ok) throw new Error('HF status ' + res.status);
        const data = await res.json();
        let summary = data[0]?.summary_text || data.summary_text || abstract.slice(0, 300) + '…';
        summaryBox.innerHTML = '<p class="summary-result">' + escapeHtml(summary) + '</p>';
      } catch(err) {
        summaryBox.innerHTML = '<p class="summary-result">' + escapeHtml(abstract.slice(0, 300)) + '…</p>';
      } finally {
        summarizeBtn.disabled = false;
      }
    }

    // ---------- Events ----------
    topicSelect.addEventListener('change', function() { loadPaper(topicSelect.value, false); });
    searchBtn.addEventListener('click', function() { lastIsAll = false; runSearch(0); });
    searchAllBtn.addEventListener('click', function() { lastIsAll = true; runSearch(0); });
    keywordInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') { lastIsAll = false; runSearch(0); } });
    prevBtn.addEventListener('click', function() { if (currentStart >= 10) runSearch(currentStart - 10); });
    nextBtn.addEventListener('click', function() { runSearch(currentStart + 10); });
    randomPaperBtn.addEventListener('click', function() { loadPaper(currentTopic, true); });
    summarizeBtn.addEventListener('click', summarizeAbstract);

    // ---------- Start ----------
    loadPaper(currentTopic, false);
  </script>
</body>
</html>
